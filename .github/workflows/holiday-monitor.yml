name: Holiday Official Source Monitor

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/holiday-monitor.yml'
      - 'automation/holiday-monitor.mjs'
  schedule:
    - cron: '17 9 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: holiday-official-source-monitor
  cancel-in-progress: false

jobs:
  verify-and-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Verify official sources and build safe patch
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          last_code=1
          for attempt in 1 2 3; do
            echo "Holiday monitor attempt ${attempt}/3"
            node automation/holiday-monitor.mjs
            last_code=$?
            if [ "$last_code" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          exit "$last_code"

      - name: Convert source connection failure to review-required state
        if: ${{ steps.verify.outcome == 'failure' }}
        shell: bash
        run: |
          cat > automation/review-required.md <<'EOF'
          # 공휴일 자동검증 검토 필요

          공식 사이트 연결 오류로 이번 자동검증을 끝까지 완료하지 못했습니다.

          - **분류:** 공식자료 연결 오류
          - **자동조치:** 기존 공휴일 패치와 기존 검증자료를 그대로 유지했습니다.
          - **사용자 조치:** 일시적인 국가법령정보센터 또는 한국천문연구원 접속 지연일 수 있으므로 다음 자동 실행 결과를 확인하세요. 반복될 경우 GitHub Actions 실행 로그를 확인하세요.

          안전을 위해 공식자료 확인에 실패한 상태에서는 공휴일 데이터를 자동 변경하지 않습니다.
          EOF

      - name: Commit verified data changes
        shell: bash
        run: |
          git config user.name "afterschool-holiday-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add holiday-patch.json automation/source-state.json automation/heartbeat.json automation/status.json
          if git diff --cached --quiet; then
            echo "No repository data changes."
          else
            git commit -m "chore: verify official holiday sources"
            git push
          fi

      - name: Open or update review issue when automatic safety check stops
        if: ${{ hashFiles('automation/review-required.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TITLE="공휴일 자동검증 검토 필요"
          NUMBER="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body-file automation/review-required.md
          else
            gh issue create --title "$TITLE" --body-file automation/review-required.md
          fi

      - name: Close review issue when status returns to normal
        if: ${{ hashFiles('automation/review-required.md') == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TITLE="공휴일 자동검증 검토 필요"
          NUMBER="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body "자동검증 상태가 정상으로 돌아와 이 Issue를 자동으로 닫습니다."
            gh issue close "$NUMBER" --reason completed
          fi
